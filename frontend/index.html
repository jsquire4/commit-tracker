<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ST6 Commit Module</title>
</head>
<body class="bg-gray-950 text-gray-100">
    <div id="root">
        <p style="padding:2rem;color:#9ca3af;font-family:sans-serif">Loading ST6 Commit Module...</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
        window.addEventListener('error', function(e) {
            document.getElementById('root').innerHTML =
                '<pre style="padding:2rem;color:red;font-family:monospace">' +
                'JS Error: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') +
                '</pre>';
        });
        window.addEventListener('unhandledrejection', function(e) {
            document.getElementById('root').innerHTML =
                '<pre style="padding:2rem;color:red;font-family:monospace">' +
                'Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) +
                '</pre>';
        });
    </script>
</body>
</html>
