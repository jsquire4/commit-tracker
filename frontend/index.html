<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <title>Compass</title>
</head>
<body class="bg-[#F9F9F7] text-[#2D3432] font-sans">
    <div id="root">
        <p style="padding:2rem;color:#5A605E;font-family:sans-serif">Loading Compass...</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
        window.addEventListener('error', function(e) {
            document.getElementById('root').innerHTML =
                '<pre style="padding:2rem;color:#9F403D;font-family:monospace">' +
                'JS Error: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') +
                '</pre>';
        });
        window.addEventListener('unhandledrejection', function(e) {
            document.getElementById('root').innerHTML =
                '<pre style="padding:2rem;color:#9F403D;font-family:monospace">' +
                'Promise Error: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) +
                '</pre>';
        });
    </script>
</body>
</html>
