spring:
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 10

compass:
  seed:
    enabled: ${COMPASS_SEED_ENABLED:false}
    observatory: ${COMPASS_SEED_OBSERVATORY:false}
  cors:
    allowed-origins: ${COMPASS_CORS_ALLOWED_ORIGINS:}
  jwt:
    issuer: ${COMPASS_JWT_ISSUER:}
    public-key: ${COMPASS_JWT_PUBLIC_KEY:}

logging:
  level:
    com.compass.platform: INFO
    org.hibernate.SQL: WARN
