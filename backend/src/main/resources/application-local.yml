spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/compass
    username: compass
    password: compasslocal
    hikari:
      maximum-pool-size: 5
  jpa:
    show-sql: true

compass:
  seed:
    enabled: true
    observatory: false  # Set to true to seed 3 orgs × 12 weeks of rich observatory data (~30s)
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:3001"
  jwt:
    # Dev bypass is profile-gated via @Profile("local") on DevTokenValidator,
    # NOT a boolean flag. No dev-mode property needed.

logging:
  level:
    com.compass.platform: DEBUG
    org.hibernate.SQL: DEBUG
