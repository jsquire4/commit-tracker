spring:
  application:
    name: compass-platform
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  # Jackson config handled by JacksonConfig.java — do not duplicate here

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

compass:
  seed:
    enabled: false
  llm:
    openai-api-key: ${OPENAI_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${LLM_MODEL:gpt-4.1-nano}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    temperature: 0.3
    max-tokens: 1024
  cors:
    # Blank default is intentional — set COMPASS_CORS_ALLOWED_ORIGINS env var in production
    # (e.g. https://yourapp.up.railway.app) or CORS will reject all cross-origin requests.
    allowed-origins: ""
  jwt:
    issuer: ""
    public-key: ""

logging:
  level:
    com.compass.platform: INFO
    org.hibernate.SQL: WARN
