# Simulation profile — adds SimulationSetupRunner behavior.
# Designed to layer on top of railway or local profiles (does not override datasource).

compass:
  seed:
    enabled: false
    observatory: false
  simulation:
    setup-file: ${COMPASS_SIMULATION_SETUP_FILE:classpath:simulation-setup.json}

logging:
  level:
    com.compass.platform.seed: DEBUG
